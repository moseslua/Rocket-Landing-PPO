[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rocket-landing-rl"
version = "0.1.0"
description = "Reproducible constrained residual RL research for rocket landing"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "arch>=7.2,<8",
  "clarabel>=0.11",
  "cvxpy>=1.6",
  "flax>=0.10",
  "gymnasium[box2d]>=1.1",
  "hydra-core>=1.3",
  "jax>=0.6",
  "numpy>=2.0",
  "optax>=0.2",
  "optuna>=4.0",
  "pandas>=1.5,<4",
  "rliable>=1.2",
  "scipy>=1.16.3,<1.17",
  "statsmodels>=0.14.6,<0.15",
  "wandb>=0.19",
]

[project.optional-dependencies]
# Solver code generation is optional; it requires a working native build toolchain.
codegen = ["cvxpygen>=1.0"]

[project.scripts]
rocket-landing = "rocket_landing.cli:main"

[dependency-groups]
dev = [
  "pre-commit>=4.0",
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["rocket_landing", "envs", "agents", "controllers"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
